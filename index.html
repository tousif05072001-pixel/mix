
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hug Lovers ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe0e6, #fff1eb, #ffd6e0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 30px 20px;
            max-width: 850px;
        }

        h1 {
            color: #e63962;
            font-size: 45px;
            margin-bottom: 15px;
        }

        p {
            color: #70404c;
            font-size: 20px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .hug-image {
            width: 100%;
            max-width: 600px;
            border-radius: 25px;
            box-shadow: 0 10px 30px #d66b7c44;
        }

        .heart {
            font-size: 35px;
            margin: 20px;
            animation: heartbeat 1s infinite;
        }

        button {
            background: #e63962;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #b91f49;
        }

        #message {
            margin-top: 20px;
            color: #e63962;
            font-weight: bold;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>❤️ Hug Lovers ❤️</h1>

        <p>
            Some hugs say what words cannot. 💕<br>
            Every hug brings two hearts closer together.
        </p>

        <img
            class="hug-image"
            src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=1000&q=80"
            alt="A loving couple sharing a warm embrace"
        >

        <div class="heart">💖 🤗 💖</div>

        <p>In your arms is my favorite place to be.</p>

        <button onclick="showLove()">Send a Hug 🤗</button>

        <div id="message"></div>
    </div>

    <script>
        function showLove() {
            document.getElementById("message").innerHTML =
                "🤗 Sending you the biggest hug and lots of love! ❤️";
        }
    </script>
</body>
</html>
