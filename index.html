
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ffb7c5, #ffc3a0);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 25px;
            border-radius: 25px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 35px #9b254444;
            z-index: 2;
        }

        h1 {
            color: #e91e63;
            font-size: 38px;
            margin-bottom: 20px;
        }

        .big-heart {
            font-size: 85px;
            animation: beat 1s infinite;
            margin: 15px 0;
        }

        p {
            color: #79354d;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #c2185b;
        }

        #message {
            margin-top: 25px;
            font-size: 20px;
            color: #e91e63;
            font-weight: bold;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: float 7s linear infinite;
            opacity: 0.7;
        }

        .floating-heart:nth-child(1) { left: 10%; animation-delay: 0s; }
        .floating-heart:nth-child(2) { left: 30%; animation-delay: 2s; }
        .floating-heart:nth-child(3) { left: 65%; animation-delay: 1s; }
        .floating-heart:nth-child(4) { left: 85%; animation-delay: 3s; }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes float {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="floating-heart">❤️</div>
    <div class="floating-heart">💕</div>
    <div class="floating-heart">💖</div>
    <div class="floating-heart">💗</div>

    <div class="card">
        <h1>For My Love ❤️</h1>

        <div class="big-heart">💖</div>

        <p>
            You are my favorite person,<br>
            my sweetest happiness,<br>
            and my most beautiful feeling. 🥰
        </p>

        <p>Every day, my heart chooses you. 💕</p>

        <button onclick="showLove()">Click for a Surprise 💌</button>

        <div id="message"></div>
    </div>

    <script>
        function showLove() {
            document.getElementById("message").innerHTML =
                "I LOVE YOU SO MUCH! ❤️😘<br>You make my world beautiful! 💖";
        }
    </script>

</body>
</html>
